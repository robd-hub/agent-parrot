<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Agent Parrot">
  <!-- Polly, the Agent Parrot: a close crop of her head so she still reads at favicon size.
       Big white eye, raised brow (she has seen your agent's answer) and a big yellow beak. -->
  <defs><clipPath id="polly-disc"><circle cx="60" cy="60" r="58"/></clipPath></defs>
  <circle cx="60" cy="60" r="58" fill="#0E3B2A"/>
  <g clip-path="url(#polly-disc)" transform="translate(-2 6)">
    <!-- crest -->
    <path d="M30 30 C26 18 30 10 38 6 C37 13 39 17 43 21 C44 12 50 7 57 8 C53 13 53 18 55 22 Z" fill="#12B76A"/>
    <!-- head and body -->
    <path d="M14 120 C4 90 10 50 34 30 C54 14 84 18 94 40 C99 52 96 64 88 70 C84 92 72 108 56 120 Z" fill="#12B76A"/>
    <!-- wing -->
    <path d="M28 78 C38 72 52 76 56 88 C58 100 50 112 38 116 C30 106 26 92 28 78 Z" fill="#0A8F52"/>
    <!-- face patch and eye -->
    <ellipse cx="72" cy="48" rx="16" ry="14" fill="#FFFFFF"/>
    <circle cx="75" cy="47" r="8.5" fill="#0E1A14"/>
    <circle cx="78" cy="44" r="3" fill="#FFFFFF"/>
    <!-- the raised eyebrow -->
    <path d="M58 30 C66 24 76 24 84 29" stroke="#0E1A14" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- beak: upper hook and lower mandible -->
    <path d="M86 38 C104 32 118 46 115 66 C114 76 108 84 101 87 C103 76 99 68 86 66 Z" fill="#FFC531"/>
    <path d="M86 66 C96 66 100 72 97 78 C92 81 87 78 84 72 Z" fill="#E0A100"/>
    <!-- cheek -->
    <circle cx="64" cy="64" r="5" fill="#F04438" opacity=".85"/>
  </g>
</svg>
